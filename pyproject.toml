[build-system]
requires = ['setuptools >= 61.0.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'fsstats'
description = 'Statistics for FastSurfer and FreeSurfer output'
license = {file = 'LICENSE'}
requires-python = '>=3.10'
authors = [
    {name = 'Kersten Diers', email = 'kersten.diers@dzne.de'},
    {name = 'Martin Reuter', email = 'martin.reuter@dzne.de'}
]
maintainers = [
    {name = 'Kersten Diers', email = 'kersten.diers@dzne.de'},
    {name = 'Martin Reuter', email = 'martin.reuter@dzne.de'}
]
keywords = [
    'FastSurfer',
    'FreeSurfer',
    'Statistics',
]
classifiers = [
    'Operating System :: Unix',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Natural Language :: English',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Science/Research',
]
dynamic = ["version", "readme", "dependencies"]

[project.optional-dependencies]
build = [
    'build',
    'twine',
]
doc = [
    'furo!=2023.8.17',
    'matplotlib',
    'memory-profiler',
    'numpydoc',
    'sphinx!=7.2.*',
    'sphinxcontrib-bibtex',
    'sphinx-copybutton',
    'sphinx-design',
    'sphinx-gallery',
    'sphinx-issues',
    'pypandoc',
    'nbsphinx',
    'IPython', # For syntax highlighting in notebooks
    'ipykernel',
    'myst_parser',
]
style = [
    'bibclean',
    'codespell',
    'pydocstyle[toml]',
    'ruff',
]
all = [
    'fsstats[build]',
    'fsstats[doc]',
    'fsstats[style]',
]
full = [
    'fsstats[all]',
]

[project.urls]
homepage = 'https://github.com/Deep-MI/fsstats'
documentation = 'https://github.com/Deep-MI/fsstats'
source = 'https://github.com/Deep-MI/fsstats'
tracker = 'https://github.com/Deep-MI/fsstats/issues'

[project.scripts]
mri_lmefit = 'fsstats.cli:lmefit_deprecated'
fsstats_lme = 'fsstats.cli:lmefit'

[tool.setuptools.dynamic]
version = {file = 'VERSION'}
readme = {file = 'DESCRIPTION.md', content-type = "text/markdown"}
dependencies = {file = 'requirements.txt'}

#[tool.setuptools] ### probably not needed
#include-package-data = false

[tool.setuptools.packages.find]
include = ['fsstats', 'fsstats.cli', 'fsstats.cfg', 'fsstats.doc', 'fsstats.utils', 'fsstats.lme']
exclude = ['docker', 'singularity']

[tool.setuptools.package-data]
"fsstats.doc" = ["*.md"]

[tool.pydocstyle]
convention = 'numpy'
ignore-decorators = '(copy_doc|property|.*setter|.*getter|pyqtSlot|Slot)'
match = '^(?!setup|__init__|test_).*\.py'
match-dir = '^fsstats.*'
add_ignore = 'D100,D104,D107'

[tool.ruff]
line-length = 120
extend-exclude = [
    ".github",
    "doc",
    "docker",
    "setup.py",
    "singularity",
    "ipynb",
    "remove",
]
ignore = ["E501", "E741"]


[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "I",   # isort
    # "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
